name: Auto Update Interest Rates

on:
  schedule:
    # Chạy mỗi ngày vào lúc 00:00 UTC (Khoảng 07:00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run update script
        run: python update_rates.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add lai_suat_all.json
          git commit -m "Auto-update interest rates" || exit 0
          git push
